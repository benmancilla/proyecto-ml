data_science:
  max_rows: 5000
  test_size: 0.2
  random_state: 42
  cv_folds: 3
  sample_frac: 0.2

classification:
  cv_folds: 3
  random_state: 42
  n_jobs: -1
  sample_size: 3000

regression:
  cv_folds: 3
  random_state: 42
  n_jobs: -1
  sample_size: 3000

unsupervised:
  random_state: 42
  variance_threshold: 0.05
  max_sample_size: 10000
  agglomerative_sample_size: 3000
  kmeans_k_range: [3, 4, 5, 6, 7]
  dbscan_eps: 0.7
  dbscan_min_samples: 10
  agg_clusters: [3, 4, 5]
  gmm_components: [3, 4, 5, 6]
  tsne_perplexity: 30
  dim_components: 2
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  anomaly_contamination: 0.05
  anomaly_estimators: 200
  lof_n_neighbors: 20
  pca_top_n_features: 10
  max_categorical_cardinality: 50
  max_zero_ratio: 0.997
  sparsify: true
  transpose_if_wide: true
